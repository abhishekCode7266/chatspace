name: chatspace
description: "Universal Chat App - All-in-One WhatsApp & Google Pay Super App: Text, HD Video Calls, Communities, In-Chat UPI Payments, Bill Recharges, Metro Tickets & Meta AI."
publish_to: "none"
version: 1.8.0+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
