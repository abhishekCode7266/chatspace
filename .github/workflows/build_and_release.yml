name: Universal Chat App CI/CD - Build APK, Play Store Bundle & Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'universal-chat-deploy'
  cancel-in-progress: true

jobs:
  test_and_analyze:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze || true

      - name: Run Flutter Tests
        run: flutter test

  build_android:
    name: Build Android Release APK & AAB (Google Play Store)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.6.0
          name: Universal Chat App v1.6.0 (Google Pay/PhonePe Ecosystem, Communities Tab, In-Chat Camera & Voice Dictation)
          draft: false
          prerelease: false
          body: |
            ## 🌐 Universal Chat App v1.6.0 Production Release 🚀📱💸🏛️
            
            Welcome to **Universal Chat App v1.6.0** — the ultimate super app combining WhatsApp communication and Google Pay / PhonePe fintech ecosystem into one unified experience!
            
            ### 📥 Download & Install (डाउनलोड करें):
            - **📱 Direct Android APK**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/v1.6.0/app-release.apk)
            - **🏬 Google Play Store Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/v1.6.0/app-release.aab)
            - **🌐 Live Web Demo**: [https://abhishekcode7266.github.io/chatspace/](https://abhishekcode7266.github.io/chatspace/)
            
            ---
            
            ### ✨ What's New in v1.6.0 (मुख्य नए फीचर्स):
            1. **💸 Google Pay & PhonePe Payments Ecosystem (पेमेंट्स, रिचार्ज व बिल भुगतान)**:
               - **Scan Any UPI QR Code**: Scan any merchant or peer QR code with animated scanning laser.
               - **Pay to Mobile Number**: Transfer money directly to phone numbers with instant UPI confirmation.
               - **Receive Money QR (पैसे प्राप्त करें)**: Generate personal UPI QR with custom amounts and simulated instant payment credit receipt notification.
               - **View Account Balance**: Secure PIN verification (default: `1234`) with instant balance display.
               - **Recharges & Utilities**: Mobile Recharge (Jio/Airtel/Vi/BSNL), Electricity Bills (UPPCL/BSES/Tata Power), FASTag Recharge, and Metro QR Tickets (Delhi/Mumbai/Bangalore Metro) with animated digital ticket pass!
               - **Cable DTH, Credit Card Bill, Loan EMI Repayment, Travel & Movie Tickets**.
               - **Transaction History**: Filter by All, Paid, Received, Recharge, Bills, with digital receipt modal and 24/7 Help & Support.
            2. **🏛️ Communities Section (कम्युनिटीज)**:
               - Dedicated 4th top tab: **CHATS**, **UPDATES**, **COMMUNITIES**, **CALLS**.
               - Create new communities with description and topic tags.
               - Official Announcement channels with loudspeaker/megaphone icon and nested sub-groups with 1-tap chat launch.
            3. **📸 WhatsApp-Style In-Chat Camera Viewfinder**:
               - Dedicated camera modal with front/rear flip, flash toggle, and shutter button to snap & send photos immediately.
            4. **🎙️ Voice Dictation / Speech-to-Text (बोलकर चैट लिखें)**:
               - Speech recognition modal with live animated waveforms, quick phrases, and 1-tap insert or send.
            5. **🎨 Emoji, GIF & Sticker 3-Tab Drawer**:
               - Integrated 3-tab drawer for Emojis, animated reaction GIFs, and stickers.
            6. **📎 10-Item Attachment Menu & Three-Dot Options**:
               - Document, Camera, Gallery, Audio, Location, Contact, Poll (वोटिंग), Payment (पेमेंट), Event, and Meta AI.
               - WhatsApp Three-Dot Menu: View Contact/Group info, Media Links & Docs, In-chat search, Mute notifications, Disappearing messages, Wallpaper/theme changer, and More.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            playstore_assets/universal_chat_icon_512.jpg

  deploy_web:
    name: Build & Deploy Web Preview to GitHub Pages
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
