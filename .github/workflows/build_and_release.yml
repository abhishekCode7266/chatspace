name: Universal Chat App CI/CD - Build APK, Play Store Bundle & Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'universal-chat-deploy'
  cancel-in-progress: true

jobs:
  test_and_analyze:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze || true

      - name: Run Flutter Tests
        run: flutter test

  build_android:
    name: Build Android Release APK & AAB (Google Play Store)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.7.0
          name: Universal Chat App v1.7.0 (Global Banking Ecosystem, Real Camera, Live Mic Recording, 186 Emojis & AI Animation Studio)
          draft: false
          prerelease: false
          body: |
            ## 🌐 Universal Chat App v1.7.0 Production Release 🚀📱💸🎬
            
            Welcome to **Universal Chat App v1.7.0** — featuring full Banking & Fintech integration, real device camera capture, WhatsApp live microphone recording, 186 categorized emojis, Channels, and AI Animation Studio!
            
            ### 📥 Download & Install (डाउनलोड करें):
            - **📱 Direct Android APK**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/v1.7.0/app-release.apk)
            - **🏬 Google Play Store Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/v1.7.0/app-release.aab)
            - **🌐 Live Web Demo**: [https://abhishekcode7266.github.io/chatspace/](https://abhishekcode7266.github.io/chatspace/)
            
            ---
            
            ### ✨ What's New in v1.7.0 (मुख्य नए फीचर्स):
            1. **🏦 All Indian & Global Banks Ecosystem (सभी भारतीय और अंतरराष्ट्रीय बैंक)**:
               - Searchable bank selector with 65+ banks across India & International categories (SBI, HDFC, ICICI, PNB, BoB, Axis, Chase, HSBC, Citi, Barclays, DBS, Bank of America, etc.).
               - Add Bank Form with IFSC/SWIFT code verification and instant account linking.
               - Full Bank Card Management Menu: Check Balance (PIN: `1234`), Change UPI PIN, Reset UPI PIN (OTP: `123456`), Set Primary Default, Switch Provider (NPCI UPI 2.0 / PhonePe Stack / Google Pay Engine), Link UPI Number, and Invite & Earn ₹201.
            2. **📸 Real Device Camera Photo Capture**:
               - Integrated device camera & gallery capture via `image_picker`, directly encoding photos into memory and rendering in chat bubbles and full-screen media preview.
            3. **🎙️ WhatsApp-Style Live Mic Recording**:
               - Tap microphone button to activate live recording mode with pulsing red recording indicator 🔴, timer (`00:01`, `00:02`), animated sound waves, trash can 🗑️ cancel button, and send button.
            4. **😀 186 Emojis across 5 Categories + 50 GIFs + 50 Stickers + Keyboard Switcher**:
               - Smileys (48), Gestures (36), Hearts (26), Food (36), Nature/Travel (40).
               - Dedicated `कीपैड (Keyboard)` ⌨️ toggle button to instantly return to typing.
            5. **🔝 Top Bar & Filter Quick Create Menu**:
               - Camera icon 📷, Rupee circular button (₹), QR scanner, Search, and 3-dot menu.
               - Filter pills: All, Unread, Favorites ⭐, Groups 👥, and Quick Action `+` (New Group, New Channel, New Community).
            6. **⏰ Scheduled Messages (शेड्यूल्ड मैसेज) & 📢 Channels (चैनल्स)**:
               - Schedule messages to be sent at specific future times.
               - Create and follow broadcast Channels in the Updates tab.
            7. **🎬 3-4 Minute AI Animation Video Generator (एनीमेशन वीडियो जनरेटर)**:
               - AI Animation Studio generating 3-4 minute narrative video concepts with 4-scene storyboard, style presets (Pixar 3D, Anime, Cyberpunk, Claymation), 16:9 video player scrubber, and 1-tap chat share.
            8. **🌐 Multilingual Universal Translator**:
               - Instant contextual translation across 30+ world and Indian regional languages.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            playstore_assets/universal_chat_icon_512.jpg

  deploy_web:
    name: Build & Deploy Web Preview to GitHub Pages
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
