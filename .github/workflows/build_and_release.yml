name: Universal Chat App CI/CD - Build APK, Play Store Bundle & Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'universal-chat-deploy'
  cancel-in-progress: true

jobs:
  test_and_analyze:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze || true

      - name: Run Flutter Tests
        run: flutter test

  build_android:
    name: Build Android Release APK & AAB (Google Play Store)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.3.0
          name: Universal Chat App v1.3.0 (Groups, Channels, Voice & Video Call Sections, Filters & Play Store Ready)
          draft: false
          prerelease: false
          body: |
            ## 🌐 Universal Chat App v1.3.0 Production Release 🚀📱
            
            Welcome to **Universal Chat App** (Universal App) — the modern, AI-friendly, professional, and secure next-generation communication platform. Designed for fast mobile messaging, group collaboration, broadcast channels, high-definition voice and video calls, and bank-grade privacy!
            
            ### 📥 Download & Install (डाउनलोड करें):
            - **📱 Direct Android APK**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/v1.3.0/app-release.apk)
            - **🏬 Google Play Store Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/v1.3.0/app-release.aab)
            - **🌐 Live Web Demo**: [https://abhishekcode7266.github.io/chatspace/](https://abhishekcode7266.github.io/chatspace/)
            
            ---
            
            ### ✨ What's New in v1.3.0 (मुख्य नए फीचर्स):
            1. **🌟 Universal Chat App Rebranding & 3D Logo**:
               - Modern, AI-friendly, tech-focused brand identity.
               - Official 512x512 glowing cyan/emerald 3D neural globe app logo (`playstore_assets/universal_chat_icon_512.jpg`).
            2. **👥 Group Chats (ग्रुप चैट)**:
               - Create custom groups with custom names, descriptions, and avatars.
               - Multi-participant messaging with sender name indicators.
               - Group badges in chat lists and dedicated group member actions.
            3. **🏷️ WhatsApp-Style Quick Filter Chips (चैट फिल्टर्स)**:
               - **All (सभी)**: Complete list of all chats.
               - **Unread (अनरीड)**: Instant filter for unread conversations.
               - **Favorites ⭐ (पसंदीदा)**: Starred conversations pinned for fast access (long-press to toggle favorite).
               - **Groups 👥 (ग्रुप्स)**: Dedicated view for community and team groups.
            4. **📢 Updates & Tech News Channels (अपडेट्स और न्यूज़ चैनल)**:
               - WhatsApp-style Status stories with 24-hour expiry and full-screen story viewer.
               - **Universal Channels Feed**: Follow broadcast channels like *Universal AI Tech Feed*, *Flutter & Mobile Ecosystem*, and *CyberSecurity & E2EE Watch*.
            5. **📞 Segmented Voice & Video Calls (अलग-अलग वॉइस और वीडियो कॉल)**:
               - Separate views and filter tabs for **📞 Voice Calls** and **📹 Video Calls**.
               - Call duration, direction indicators (incoming, outgoing, missed), and 1-tap call triggers.
            6. **📎 Rich Media & Document Sharing (मल्टीमीडिया और डॉक्यूमेंट्स)**:
               - Send & receive photos, video clips, and PDF/office documents with file sizes.
               - Interactive voice notes with audio waveform visualization and play/pause controls.
               - Long-press message emoji reactions (`👍`, `❤️`, `😂`, `😮`, `😢`, `🙏`).
            7. **🛡️ Military-Grade Security & Privacy (सुरक्षा)**:
               - 256-bit End-to-End Encryption (E2EE) cryptographic badges.
               - 60-digit safety verification code with QR share code.
               - Disappearing messages option (24 hours, 7 days, 90 days).
               - 4-digit PIN App Lock & Biometrics ready.
            8. **🔓 Developer Mode Bypass (डेवलपर मोड बाईपास)**:
               - 1-click **Developer Mode Bypass** on the login screen or 4-tap on the splash logo to test all features instantly without requiring SMS or Firebase backend setup.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            playstore_assets/universal_chat_icon_512.jpg

  deploy_web:
    name: Build & Deploy Web Preview to GitHub Pages
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
