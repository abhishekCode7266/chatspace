name: ChatSpace CI/CD - Build APK, Play Store Bundle & Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'chatspace-deploy'
  cancel-in-progress: true

jobs:
  test_and_analyze:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze || true

      - name: Run Flutter Tests
        run: flutter test

  build_android:
    name: Build Android Release APK & AAB (Google Play Store)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatspace-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatspace-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.0
          name: ChatSpace v1.1.0 (WhatsApp UI, HD Video Calling & Security Release)
          draft: false
          prerelease: false
          body: |
            ## ChatSpace v1.1.0 Production Release 🚀💬
            
            Welcome to **ChatSpace** - updated with WhatsApp-Style Chat Bar, HD Video Calling, and Advanced Security!
            
            ### 📱 Download & Install:
            - **Download Android APK**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/v1.1.0/app-release.apk)
            - **Google Play Store App Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/v1.1.0/app-release.aab)
            
            ### ✨ What's New in v1.1.0:
            - 🎨 **Play Store Official Logo & App Icon**: Sleek emerald-green shield chat logo.
            - 💬 **WhatsApp-Style Chat Bar (व्हाट्सएप जैसा चैट बार)**: Rounded pill bar, emoji quick picker, attachment modal sheet (Docs, Camera, Gallery, Audio, Location, Contact), and dynamic Mic/Send action button.
            - 📹 **WhatsApp HD Video & Voice Calling (वीडियो कॉलिंग)**: Video Call with Picture-in-Picture (PiP) local camera feed, camera flip, mic mute, speaker toggle, and animated calling timer.
            - 🔒 **Security & Privacy Features (सिक्योरिटी)**: End-to-End Encryption (E2EE), 60-digit cryptographic verification code, 4-digit PIN App Lock, and Block Contacts.
            - 🔐 **Developer Mode Bypass (डेवलपर मोड बाईपास)**: 1-click bypass login to test all features instantly!
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            playstore_assets/chatspace_icon_512.jpg

  deploy_web:
    name: Build & Deploy Web Preview to GitHub Pages
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
