name: Universal Chat App CI/CD - Build APK, Play Store Bundle & Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'universal-chat-deploy'
  cancel-in-progress: true

jobs:
  test_and_analyze:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze || true

      - name: Run Flutter Tests
        run: flutter test

  build_android:
    name: Build Android Release APK & AAB (Google Play Store)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.8.1
          name: Universal Chat App v1.8.1 (Live Camera Face Capture, Audible Voice Notes, WhatsApp Wallpapers & Multilingual Translation)
          draft: false
          prerelease: false
          body: |
            ## 🌐 Universal Chat App v1.8.1 Production Release 🚀📸🎙️🎨🌐
            
            Welcome to **Universal Chat App v1.8.1** — featuring real live camera face capture, genuine audible voice note playback, authentic WhatsApp wallpaper themes, keypad autofocus with quick phrases, and 12-language in-chat translation!
            
            ### 📥 Download & Install (डाउनलोड करें):
            - **📱 Direct Android APK**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/v1.8.1/app-release.apk)
            - **🏬 Google Play Store Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/v1.8.1/app-release.aab)
            - **🌐 Live Web Demo**: [https://abhishekcode7266.github.io/chatspace/](https://abhishekcode7266.github.io/chatspace/)
            
            ---
            
            ### ✨ What's New in v1.8.1 (मुख्य नए फीचर्स):
            1. **📸 Live Camera & Selfie Face Capture (कैमरा डायरेक्ट फोटो खींचे)**:
               - Direct live webcam & front/rear camera access with real-time video viewfinder showing user's live face.
               - Front selfie mirror toggle and front/rear flip button.
               - Instant shutter capture from live video feed into Base64 JPEG data URL sent straight to the chat.
            2. **🎙️ Real Audible Voice Note Playback (माइक व असली आवाज़ प्लेबैक)**:
               - Genuine audible sound output through device speakers using Web Audio API and Speech Synthesis.
               - Animated audio waveform bars and live elapsed duration counter (`0:01 / 0:14`).
               - Seamless play/pause/auto-reset behavior.
            3. **🎨 WhatsApp Wallpapers & Chat Themes (थीम इमेज व वॉलपेपर)**:
               - 8 curated wallpapers including WhatsApp Classic, Dark Doodle, Emerald Forest, Midnight Sky, Sunset Amber, Cyberpunk Neon, Rose Romance, and Clean Slate.
               - Custom WhatsApp Doodle painter rendering authentic subtle background doodles.
               - Dedicated "थीम (Themes)" 4th tab in the drawer next to Emojis, GIFs, and Stickers.
            4. **⌨️ Keypad Autofocus & Quick Phrases (कीपैड व तुरंत जवाब)**:
               - "कीपैड (Keyboard)" button cleanly dismisses drawer and requests focus on the message input.
               - 1-tap quick reply chips (नमस्ते!, हाँ, बिल्कुल, धन्यवाद!, How are you?, OK, done!).
            5. **🌐 In-Chat Multilingual Translation (12 भाषाओं में अनुवाद)**:
               - Instant in-bubble message translation between Hindi, English, Spanish, French, German, Arabic, Bengali, Marathi, Tamil, Telugu, Gujarati, and Urdu.
               - Live auto-translate outgoing messages toggle.
               - Tap microphone button to activate live recording mode with pulsing red recording indicator 🔴, timer (`00:01`, `00:02`), animated sound waves, trash can 🗑️ cancel button, and send button.
            4. **😀 186 Emojis across 5 Categories + 50 GIFs + 50 Stickers + Keyboard Switcher**:
               - Smileys (48), Gestures (36), Hearts (26), Food (36), Nature/Travel (40).
               - Dedicated `कीपैड (Keyboard)` ⌨️ toggle button to instantly return to typing.
            5. **🔝 Top Bar & Filter Quick Create Menu**:
               - Camera icon 📷, Rupee circular button (₹), QR scanner, Search, and 3-dot menu.
               - Filter pills: All, Unread, Favorites ⭐, Groups 👥, and Quick Action `+` (New Group, New Channel, New Community).
            6. **⏰ Scheduled Messages (शेड्यूल्ड मैसेज) & 📢 Channels (चैनल्स)**:
               - Schedule messages to be sent at specific future times.
               - Create and follow broadcast Channels in the Updates tab.
            7. **🎬 3-4 Minute AI Animation Video Generator (एनीमेशन वीडियो जनरेटर)**:
               - AI Animation Studio generating 3-4 minute narrative video concepts with 4-scene storyboard, style presets (Pixar 3D, Anime, Cyberpunk, Claymation), 16:9 video player scrubber, and 1-tap chat share.
            8. **🌐 Multilingual Universal Translator**:
               - Instant contextual translation across 30+ world and Indian regional languages.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            playstore_assets/universal_chat_icon_512.jpg

  deploy_web:
    name: Build & Deploy Web Preview to GitHub Pages
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/chatspace/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
