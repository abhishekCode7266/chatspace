name: Universal Chat App CI/CD - Build APK, Play Store Bundle & Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'universal-chat-deploy'
  cancel-in-progress: true

jobs:
  test_and_analyze:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze || true

      - name: Run Flutter Tests
        run: flutter test

  build_android:
    name: Build Android Release APK & AAB (Google Play Store)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.5.0
          name: Universal Chat App v1.5.0 (Meta AI Floating Circle, WhatsApp Pay UPI, QR Code Hub & Cloud Subscriptions)
          draft: false
          prerelease: false
          body: |
            ## 🌐 Universal Chat App v1.5.0 Production Release 🚀📱🤖💳
            
            Welcome to **Universal Chat App v1.5.0** — the premier communication and payment powerhouse. Packed with WhatsApp-style Meta AI floating assistance, in-chat bank UPI payments, scannable QR hubs, and premium subscriptions with extra cloud storage!
            
            ### 📥 Download & Install (डाउनलोड करें):
            - **📱 Direct Android APK**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/v1.5.0/app-release.apk)
            - **🏬 Google Play Store Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/v1.5.0/app-release.aab)
            - **🌐 Live Web Demo**: [https://abhishekcode7266.github.io/chatspace/](https://abhishekcode7266.github.io/chatspace/)
            
            ---
            
            ### ✨ What's New in v1.5.0 (मुख्य नए फीचर्स):
            1. **🟣 Meta AI Floating Assistant Circle (WhatsApp Style)**:
               - Circular animated glowing ring floating prominently on the right-hand side right above the chat FAB.
               - 1-tap instant activation to Universal Meta AI assistant.
               - Inline chat bar AI action button for quick queries and `/imagine` 3D image generation directly within conversations.
            2. **💳 WhatsApp Pay & UPI In-Chat Payments (पेमेंट्स व बैंक खाते)**:
               - Send & request money directly inside any 1-to-1 conversation via the attachment menu.
               - Beautiful green UPI transaction cards embedded in message bubbles with instant status check and reference IDs.
               - Dedicated Payments Center with linked bank accounts (SBI, HDFC, Paytm), balance checking, and transaction history.
               - Secure 4-digit UPI PIN verification (default test drive PIN: `1234`).
            3. **📲 WhatsApp-Style QR Code System (क्यूआर कोड सिस्टम)**:
               - **My Code**: High-resolution personal profile QR code to share or display for instant 1-to-1 contact adding.
               - **Group Invite**: Group QR codes allowing anyone to scan and instantly join groups or communities.
               - **Live Camera Scanner**: Viewfinder with animated laser line and instant 1-tap card detection for users, groups, and payments.
            4. **⭐ Freemium AI & Premium Cloud Subscriptions (प्रीमियम सब्सक्रिप्शन)**:
               - Free tier with 15 free daily Meta AI queries quota tracking.
               - Exceeding the daily limit displays upgrade prompt to **Universal Pro** or **Business Enterprise**.
               - **Universal Pro (₹199/mo)**: 100GB extra cloud storage, unlimited Meta AI + `/imagine` image generation, verified gold star badge ⭐, and 100% ad-free experience.
               - **Business Enterprise (₹699/mo)**: 1TB cloud storage, team customer service bot, business catalog boost, and verified green badge ✅.
               - In-app cloud storage usage progress bar and simulated 1-click UPI upgrade.
            5. **⚡ Floating Developer Bypass Circle (छोटा सा गोला)**:
               - Unlocks all screens, tests, and mock databases without requiring SMS / phone setup.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            playstore_assets/universal_chat_icon_512.jpg

  deploy_web:
    name: Build & Deploy Web Preview to GitHub Pages
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
