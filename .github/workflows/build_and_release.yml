name: Universal Chat App CI/CD - Build APK, Play Store Bundle & Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'universal-chat-deploy'
  cancel-in-progress: true

jobs:
  test_and_analyze:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze || true

      - name: Run Flutter Tests
        run: flutter test

  build_android:
    name: Build Android Release APK & AAB (Google Play Store)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-chat-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.4.0
          name: Universal Chat App v1.4.0 (AI Suite, Group Video Calls, Business Hub, Admin Panel & Floating Dev Circle Bypass)
          draft: false
          prerelease: false
          body: |
            ## 🌐 Universal Chat App v1.4.0 Production Release 🚀📱🤖
            
            Welcome to **Universal Chat App v1.4.0** — the ultimate all-in-one next-generation communication platform. Designed for fast mobile messaging, group collaboration, broadcast channels, high-definition group voice/video calls, enterprise business features, built-in AI intelligence, bank-grade E2EE privacy, and complete developer tools!
            
            ### 📥 Download & Install (डाउनलोड करें):
            - **📱 Direct Android APK**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/v1.4.0/app-release.apk)
            - **🏬 Google Play Store Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/v1.4.0/app-release.aab)
            - **🌐 Live Web Demo**: [https://abhishekcode7266.github.io/chatspace/](https://abhishekcode7266.github.io/chatspace/)
            
            ---
            
            ### ✨ What's New in v1.4.0 (मुख्य नए फीचर्स):
            1. **⚡ Floating Developer Circle Bypass (छोटा सा गोला)**:
               - Prominent pulsating draggable circular button floating on top of all screens.
               - 1-tap instant Developer Mode Bypass to unlock all authentication, screens, and administrative features without requiring phone numbers or SMS setup.
               - Includes quick simulation triggers (switch users, clear mock data, reset PIN, inject test chats).
            2. **🤖 Optimal Universal AI Suite**:
               - **Universal AI Chat Assistant**: Smart multi-turn generative companion.
               - **Message Summarizer**: Condenses long chat histories or documents into bulleted action items.
               - **Real-Time Language Translator**: Instant translation across English, Hindi, Spanish, French, German, Arabic, Chinese, and Japanese.
               - **3D AI Image Generation**: Text-to-image prompt visualization for social posts and avatars.
               - **Document & PDF Analysis**: Intelligent keyword and structure extraction from documents.
            3. **👥 Group Voice & Video Calling (मल्टी-पार्टिसिपेंट ग्रुप कॉलिंग)**:
               - High-definition 2x2 responsive video grid with active speaker glow indicators.
               - Controls for mute/unmute, front/rear camera toggle, screen sharing simulation, and speaker/earpiece route.
            4. **💼 Business Platform & Commerce**:
               - Official Business Profile with verified badge, hours, address, and website.
               - Product Catalog with prices, photos, and customer ordering workflow.
               - Automated greeting messages, away responses, and customer support tracking.
            5. **🛡️ Admin Command Center & Moderation**:
               - Real-time system telemetry (active users, total groups, message counts, server uptime %, network latency ms).
               - User management with instant ban/unban controls.
               - Spam detection, content reports moderation, and global broadcast announcements.
            6. **💬 Advanced Next-Gen Messaging**:
               - Quoted replies, message editing with `(edited)` tag, and delete for me/everyone.
               - Pinned messages header banner in chat rooms.
               - Starred / bookmarked messages repository screen.
               - Location cards, contact vCard sharing, stickers, and interactive voice notes.
               - Full-screen media preview viewer with zoom and download progress.
            7. **💻 Linked Devices & Multi-Device Sync**:
               - Manage active Web and Desktop sessions with QR code scanner pairing.
            8. **☁️ Cloud Backup & Restore**:
               - Encrypted backup size estimation, Google Drive / Cloud sync, and 1-tap restore.
            9. **🔒 Bank-Grade Privacy & Security**:
               - 256-bit AES End-to-End Encryption with 60-digit verification fingerprint.
               - App Lock with 4-digit PIN, Biometrics toggle, 2-Step Verification, and Blocked Contacts manager.
            10. **🔍 Global Search Hub**:
                - Universal search across users, chats, messages, media, audio, documents, and links with date filters.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            playstore_assets/universal_chat_icon_512.jpg

  deploy_web:
    name: Build & Deploy Web Preview to GitHub Pages
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
